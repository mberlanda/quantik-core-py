name: Contracts

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-contract-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # quantik-core-contracts removed the composite validate-contracts action
      # in mberlanda/quantik-core-contracts#6 ("keep validate-contracts local to
      # the workflow"). It survives only in the v1.1.0 tag, so this job pinned
      # itself to a deleted action. Call the script from a pinned checkout.
      - name: Checkout contracts
        uses: actions/checkout@v7
        with:
          repository: mberlanda/quantik-core-contracts
          ref: v1.3.0
          path: .contracts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate contract fixtures
        run: |
          python .contracts/scripts/validate_contracts.py \
            --fixture-glob "tests/fixtures/selfplay*.jsonl" \
            --expected-release 1.3.0

  opening-book-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Python stack
        uses: actions/checkout@v7
        with:
          path: quantik-core-py

      - name: Checkout Rust stack
        uses: actions/checkout@v7
        with:
          repository: mberlanda/quantik-core-rust
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
          path: quantik-core-rust

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use stable Rust
        run: rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python package
        working-directory: quantik-core-py
        run: python -m pip install -e .

      - name: Run opening-book consistency action
        # expected-release is deliberately not set here: this job checks out
        # quantik-core-rust at `main`, and asserting a fixed release against
        # a sibling's main is exactly the cross-repo circular-wait deadlock
        # this project hit once already during the 1.2.0 release (see
        # https://mauroberlanda.substack.com/p/the-deadlock-i-wrote-myself-when).
        # This step is drift detection only (do both stacks enumerate the
        # same opening-book graph?); version alignment is verified against
        # published PyPI/crates.io artifacts by a separate nightly job in
        # quantik-core-contracts instead.
        uses: mberlanda/quantik-core-contracts/actions/opening-book-consistency@v1.3.1
        with:
          rust-command: |
            mkdir -p quantik-core-rust/target/opening-book-consistency
            cd quantik-core-rust
            scripts/generate_opening_book.sh search \
              --depth 4 \
              --db target/opening-book-consistency/depth4.sqlite \
              --profile debug \
              --quiet
            scripts/inspect_opening_book.sh summary-json \
              --db target/opening-book-consistency/depth4.sqlite \
              --depth 4 \
              --output target/opening-book-consistency/rust-summary.json \
              --profile debug
          python-command: |
            cd quantik-core-py
            python -m quantik_core.opening_book_summary \
              --db ../quantik-core-rust/target/opening-book-consistency/depth4.sqlite \
              --depth 4 \
              --output ../quantik-core-rust/target/opening-book-consistency/python-summary.json
          rust-summary: quantik-core-rust/target/opening-book-consistency/rust-summary.json
          python-summary: quantik-core-rust/target/opening-book-consistency/python-summary.json
          expected-depth: "4"
